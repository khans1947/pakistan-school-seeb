<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#01411C"/>
      <stop offset="100%" stop-color="#00662B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A859"/>
      <stop offset="100%" stop-color="#01411C"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="480" height="360" fill="url(#sky)"/>
  <!-- Ground -->
  <rect y="280" width="480" height="80" fill="#86EFAC" opacity="0.5"/>
  <rect y="300" width="480" height="60" fill="#4ADE80" opacity="0.35"/>
  <!-- Main building -->
  <rect x="80" y="120" width="320" height="180" rx="4" fill="url(#wall)" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Roof -->
  <path d="M60 120 L240 50 L420 120 Z" fill="url(#roof)"/>
  <rect x="220" y="55" width="40" height="30" fill="#0F172A"/>
  <!-- Flag pole -->
  <rect x="236" y="20" width="3" height="40" fill="#64748B"/>
  <path d="M239 22 L270 30 L239 38 Z" fill="#01411C"/>
  <circle cx="265" cy="30" r="5" fill="#FFFFFF"/>
  <path d="M263 28.5 A3 3 0 0 0 265 32.5" fill="none" stroke="#01411C" stroke-width="1"/>
  <!-- Windows row 1 -->
  <rect x="100" y="145" width="36" height="40" rx="2" fill="#BFDBFE" stroke="#94A3B8" stroke-width="1"/>
  <rect x="150" y="145" width="36" height="40" rx="2" fill="#BFDBFE" stroke="#94A3B8" stroke-width="1"/>
  <rect x="200" y="145" width="36" height="40" rx="2" fill="#BFDBFE" stroke="#94A3B8" stroke-width="1"/>
  <rect x="250" y="145" width="36" height="40" rx="2" fill="#BFDBFE" stroke="#94A3B8" stroke-width="1"/>
  <rect x="300" y="145" width="36" height="40" rx="2" fill="#BFDBFE" stroke="#94A3B8" stroke-width="1"/>
  <rect x="350" y="145" width="36" height="40" rx="2" fill="#BFDBFE" stroke="#94A3B8" stroke-width="1"/>
  <!-- Windows row 2 -->
  <rect x="100" y="200" width="36" height="40" rx="2" fill="#BFDBFE" stroke="#94A3B8" stroke-width="1"/>
  <rect x="150" y="200" width="36" height="40" rx="2" fill="#BFDBFE" stroke="#94A3B8" stroke-width="1"/>
  <rect x="300" y="200" width="36" height="40" rx="2" fill="#BFDBFE" stroke="#94A3B8" stroke-width="1"/>
  <rect x="350" y="200" width="36" height="40" rx="2" fill="#BFDBFE" stroke="#94A3B8" stroke-width="1"/>
  <!-- Entrance -->
  <rect x="200" y="200" width="80" height="100" rx="2" fill="#01411C"/>
  <rect x="215" y="220" width="50" height="80" rx="4" fill="#0F172A"/>
  <circle cx="255" cy="260" r="3" fill="#D4AF37"/>
  <!-- Steps -->
  <rect x="190" y="295" width="100" height="8" fill="#94A3B8"/>
  <rect x="180" y="303" width="120" height="8" fill="#64748B"/>
  <!-- Side wing left -->
  <rect x="40" y="180" width="50" height="120" rx="2" fill="url(#wall)" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="50" y="195" width="30" height="28" rx="2" fill="#BFDBFE" stroke="#94A3B8"/>
  <rect x="50" y="235" width="30" height="28" rx="2" fill="#BFDBFE" stroke="#94A3B8"/>
  <!-- Side wing right -->
  <rect x="390" y="180" width="50" height="120" rx="2" fill="url(#wall)" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="400" y="195" width="30" height="28" rx="2" fill="#BFDBFE" stroke="#94A3B8"/>
  <rect x="400" y="235" width="30" height="28" rx="2" fill="#BFDBFE" stroke="#94A3B8"/>
  <!-- Trees -->
  <ellipse cx="50" cy="290" rx="22" ry="30" fill="#166534"/>
  <rect x="47" y="300" width="6" height="20" fill="#78350F"/>
  <ellipse cx="430" cy="285" rx="25" ry="35" fill="#166534"/>
  <rect x="427" y="295" width="6" height="25" fill="#78350F"/>
  <!-- Banner on building -->
  <rect x="140" y="255" width="50" height="14" rx="2" fill="url(#accent)"/>
  <rect x="290" y="255" width="50" height="14" rx="2" fill="url(#accent)"/>
</svg>
